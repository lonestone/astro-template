# Cloudflare only (`deploy: 'cloudflare'` in website.config.ts). Delete this file on Netlify.
# Needs the CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID secrets, see "Deployment" in README.md.
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

# A newer push replaces a deploy still running.
concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          # The sitemap reads each page's last commit date (src/utils/content-lastmod.ts).
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # Images optimized by sharp, reused from the previous build. A cache entry
      # can't be overwritten, so each run saves a new one and restores the latest.
      - uses: actions/cache@v4
        with:
          path: node_modules/.astro
          key: astro-${{ github.run_id }}
          restore-keys: astro-

      - run: npm run build

      - run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
